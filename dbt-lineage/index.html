<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBT LINEAGE RADAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="scan-line"></div>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="title-icon">📡</span>
                    DBT LINEAGE RADAR
                </h1>
                <div class="controls">
                    <input type="text" id="searchBox" placeholder="SCAN FOR SIGNALS..." class="search-input">
                    <button id="resetBtn" class="btn btn-reset">RESET RADAR</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>Signal Types</h3>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #00ffff; color: #00ffff;"></span>
                        <span>DBT Models</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #00ff00; color: #00ff00;"></span>
                        <span>Source Tables</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #ffff00; color: #ffff00;"></span>
                        <span>Staging</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Statistics</h3>
                    <div class="stat-item">
                        <span class="stat-label">Total Models:</span>
                        <span class="stat-value" id="totalModels">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Source Tables:</span>
                        <span class="stat-value" id="totalSources">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Dependencies:</span>
                        <span class="stat-value" id="totalDeps">0</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Signal Details</h3>
                    <div id="nodeInfo" class="node-info">
                        <p class="info-empty">SELECT A SIGNAL TO ANALYZE...</p>
                    </div>
                </div>
            </aside>

            <!-- Graph Container -->
            <div class="graph-container">
                <svg id="graph"></svg>
                <div class="zoom-controls">
                    <button id="zoomIn" class="zoom-btn">+</button>
                    <button id="zoomOut" class="zoom-btn">−</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
